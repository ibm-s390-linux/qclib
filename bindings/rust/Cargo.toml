[workspace.package]
edition = "2021"
license-file = "LICENSE"

[package]
name = "qclib"
version = "2.0.0"
edition.workspace = true
license-file.workspace = true
description = "Rust bindings for qclib (Query Capacity Library)"

[dependencies]
serde_json = { version = "1.0", optional = true }

[features]
all = ["json"]
json = ["dep:serde_json"]

[dependencies.sys]
package = "qclib-sys"
path = "qclib-sys"
version = "2"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
